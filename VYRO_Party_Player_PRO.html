<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYRO Party Player PRO</title>
<style>
:root{
 --bg:#050811;--panel:#0c1422;--panel2:#101c2e;--line:#21314b;
 --text:#f1f7ff;--muted:#8fa4c1;--blue:#32aaff;--violet:#765cff;
 --green:#34d399;--red:#ff5875;--yellow:#f4c95d;
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#142a48 0,#050811 42%),#050811;color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}
.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh}
.sidebar{background:rgba(4,8,15,.96);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:21px;font-weight:950;letter-spacing:.08em;margin:4px 8px 18px}.logo i{font-style:normal;color:var(--blue)}
.nav,.cat{width:100%;padding:10px 11px;text-align:left;background:transparent;color:var(--muted);border-radius:9px;margin:2px 0}
.nav:hover,.cat:hover,.cat.active{background:#13243c;color:#fff}
.section{font-size:10px;color:#607796;letter-spacing:.13em;text-transform:uppercase;margin:20px 8px 7px}
.main{padding:20px;max-width:1600px;width:100%;margin:auto}
.top{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px}
.search{display:flex;gap:7px;width:min(650px,100%)}input,select{background:#091220;color:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;outline:none}input:focus,select:focus{border-color:var(--blue)}
.search input{flex:1}.btn{padding:10px 12px;border-radius:9px;background:#17263d;color:#e6f2ff}.primary{background:linear-gradient(135deg,var(--blue),var(--violet));font-weight:800}.green{background:#123b34;color:#8ff3cf}.danger{background:#391523;color:#ffb7c5}.yellow{background:#3b3216;color:#ffe39a}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px}
.panel{background:rgba(12,20,34,.9);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.list{max-height:calc(100vh - 220px);overflow:auto}
.song{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 14px;border-bottom:1px solid rgba(33,49,75,.65)}.song:hover{background:#101d31}
.title{font-weight:750}.meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:5px;align-items:center}.icon{padding:7px 8px;border-radius:8px;background:#172840;color:#dceeff}.fav.on{color:#ffd85c}
.badge{font-size:11px;background:#162941;color:#a9d9ff;border-radius:999px;padding:4px 8px}
.player{padding:13px}.video{aspect-ratio:16/9;background:#02050a;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}.video iframe{width:100%;height:100%;border:0}
.now{padding:10px 2px}.now b{display:block}.controls{display:flex;gap:7px;flex-wrap:wrap}.range{width:100%}
.queue{max-height:230px;overflow:auto}.qrow{display:grid;grid-template-columns:1fr auto;gap:5px;padding:8px 0;border-bottom:1px solid var(--line)}
.results{padding:12px}.result{display:grid;grid-template-columns:96px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.result img{width:96px;height:54px;object-fit:cover;border-radius:7px}.result .ra{grid-column:2;display:flex;gap:5px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0c1422;border:1px solid var(--line);border-radius:15px;padding:18px}
.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.form input,.form select{width:100%}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{background:#101f34;border:1px solid #294463;padding:10px;border-radius:9px;color:#bcdcff;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101d30;border:1px solid var(--line);padding:10px 14px;border-radius:9px;display:none;z-index:80}
.admin-off{display:none!important}
@media(max-width:1100px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.layout{grid-template-columns:1fr}.list{max-height:none}}
@media(max-width:650px){.main{padding:12px}.top{align-items:stretch;flex-direction:column}.search{width:100%}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.result{grid-template-columns:80px 1fr}.result img{width:80px;height:50px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">VYRO<i>•</i>PLAYER PRO</div>
  <button class="nav" onclick="allSongs()">🏠 Alle Songs</button>
  <button class="nav" onclick="showFavorites()">⭐ Favoriten</button>
  <button class="nav" onclick="openAdd()">➕ Song hinzufügen</button>
  <button class="nav" onclick="openCategoryManager()">📂 Kategorien</button>
  <button class="nav" onclick="openDataManager()">💾 Import / Export</button>
  <button class="nav" onclick="openSettings()">⚙️ Einstellungen</button>
  <div class="section">Kategorien</div>
  <div id="cats"></div>
  <div class="section">Admin</div>
  <button class="nav" onclick="adminLogin()">🔐 Control Room</button>
  <div class="notice" style="margin-top:12px">556 Start-Songs aus deiner bereitgestellten Liste.</div>
</aside>

<main class="main">
  <div class="top">
    <div><h1 id="heading">Alle Songs</h1><div class="sub" id="sub"></div></div>
    <div class="search"><input id="search" placeholder="Song, Künstler oder Kategorie …" oninput="render()"><button class="btn primary" onclick="ytSearch()">🔎 YouTube</button></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="statSongs">0</b><span>sichtbare Songs</span></div>
    <div class="stat"><b id="statFav">0</b><span>Favoriten</span></div>
    <div class="stat"><b id="statQueue">0</b><span>Queue</span></div>
    <div class="stat"><b id="statOwn">0</b><span>eigene Songs</span></div>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="head"><strong>🎵 Bibliothek</strong><div class="toolbar"><select id="sort" onchange="render()"><option value="source">Standard</option><option value="az">A–Z Titel</option><option value="artist">Künstler</option><option value="category">Kategorie</option><option value="newest">Neu hinzugefügt</option></select></div></div>
      <div class="list" id="list"></div>
    </section>

    <aside class="panel">
      <div class="head"><strong>▶ Player</strong><span class="badge">YouTube</span></div>
      <div class="player">
        <div class="video" id="video">Noch kein Song ausgewählt.</div>
        <div class="now" id="now"><span class="meta">Wähle einen Song oder eine YouTube-Suche.</span></div>
        <div class="controls">
          <button class="btn" onclick="previousQueue()">⏮</button>
          <button class="btn" onclick="togglePause()">⏯</button>
          <button class="btn" onclick="nextQueue()">⏭</button>
          <button class="btn" onclick="stopPlayer()">⏹</button>
          <button class="btn yellow" onclick="toggleAutoNext()">AUTO: <span id="autoState">AN</span></button>
          <button class="btn" onclick="addCurrentToQueue()">➕ Queue</button>
          <label style="display:flex;align-items:center;gap:7px;width:100%;color:var(--muted)">🔊 Lautstärke <input class="range" id="volume" type="range" min="0" max="100" value="100" onchange="setVolume(this.value)"></label>
        </div>
      </div>

      <div class="head"><strong>🎧 Queue</strong><span class="badge" id="queueCount">0</span></div>
      <div class="queue" id="queue"></div>

      <div class="head"><strong>🔎 YouTube</strong></div>
      <div class="results" id="results"><div class="empty">Suche nach einem Song oder Künstler.</div></div>
    </aside>
  </div>
</main>
</div>

<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

function all(){let a=[];START_CATEGORIES.forEach(c=>c.songs.forEach(s=>a.push({...s,category:c.name,custom:false,key:"start:"+c.name+":"+s.artist+":"+s.title})));ownSongs.forEach(s=>a.push({...s,custom:true,key:"own:"+s.id}));return a}
function categories(){return [...START_CATEGORIES,...ownCats.map(n=>({name:n,songs:ownSongs.filter(s=>s.category===n)}))]}
function catsRender(){document.getElementById("cats").innerHTML=categories().map(c=>`<button class="cat ${filterCat===c.name?"active":""}" onclick='category(${JSON.stringify(c.name)})'>${esc(c.name)} <span style="float:right">${c.songs.length}</span></button>`).join("")}
function category(n){filterCat=n;favOnly=false;document.getElementById("heading").textContent=n;render();catsRender()}
function allSongs(){filterCat=null;favOnly=false;document.getElementById("heading").textContent="Alle Songs";render();catsRender()}
function showFavorites(){filterCat=null;favOnly=true;document.getElementById("heading").textContent="⭐ Favoriten";render();catsRender()}
function isFav(s){return favorites.includes(s.key)}
function toggleFav(key){favorites=favorites.includes(key)?favorites.filter(x=>x!==key):[...favorites,key];save();render()}
function getVisible(){
 let a=all(),q=document.getElementById("search").value.trim().toLowerCase();
 if(filterCat)a=a.filter(s=>s.category===filterCat);if(favOnly)a=a.filter(isFav);
 if(q)a=a.filter(s=>(s.artist+" "+s.title+" "+s.category).toLowerCase().includes(q));
 const mode=document.getElementById("sort").value;
 if(mode==="az")a.sort((x,y)=>x.title.localeCompare(y.title,"de"));else if(mode==="artist")a.sort((x,y)=>x.artist.localeCompare(y.artist,"de"));else if(mode==="category")a.sort((x,y)=>x.category.localeCompare(y.category,"de"));else if(mode==="newest")a=a.reverse();
 return a;
}
function render(){
 const a=getVisible();document.getElementById("sub").textContent=a.length+" Songs";document.getElementById("statSongs").textContent=a.length;document.getElementById("statFav").textContent=favorites.length;document.getElementById("statQueue").textContent=queue.length;document.getElementById("statOwn").textContent=ownSongs.length;
 document.getElementById("list").innerHTML=a.length?a.map(s=>`<div class="song"><div><div class="title">${esc(s.title)}</div><div class="meta">${esc(s.artist)} · ${esc(s.category)}${s.custom?" · EIGEN":""}</div></div><div class="actions"><button class="icon fav ${isFav(s)?"on":""}" title="Favorit" onclick='toggleFav(${JSON.stringify(s.key)})'>★</button><button class="icon" onclick='playSong(${JSON.stringify(s)})'>▶</button><button class="icon" onclick='queueAdd(${JSON.stringify(s)})'>＋</button><button class="icon" onclick='openYouTube(${JSON.stringify(s.artist+" "+s.title)})'>YT</button>${s.custom?`<button class="icon danger" onclick='deleteSong(${JSON.stringify(s.id)})'>🗑</button>`:""}</div></div>`).join(""):'<div class="empty">Keine Songs gefunden.</div>';
 renderQueue();
}
function extractId(url){try{let u=new URL(url);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);if(u.searchParams.get("v"))return u.searchParams.get("v");let m=u.pathname.match(/\/(?:embed|shorts)\/([^/]+)/);return m?m[1]:""}catch{return ""}}
function playSong(s){
 current=s;paused=false;
 let id=s.videoId||extractId(s.url||"");
 if(id)playVideo(id,s.artist+" – "+s.title);else ytSearchFor(s.artist+" "+s.title,true);
}
function playVideo(id,title){
 document.getElementById("video").innerHTML=`<iframe id="ytframe" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&enablejsapi=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;
 document.getElementById("now").innerHTML=`<b>${esc(title)}</b><span class="meta">YouTube · Lautstärke ${volume}%</span>`;
}
function togglePause(){let f=document.getElementById("ytframe");if(!f)return;paused=!paused;f.contentWindow.postMessage(JSON.stringify({event:"command",func:paused?"pauseVideo":"playVideo",args:[]}),"*")}
function stopPlayer(){document.getElementById("video").innerHTML="Player gestoppt.";current=null}
function setVolume(v){volume=Number(v);let f=document.getElementById("ytframe");if(f)f.contentWindow.postMessage(JSON.stringify({event:"command",func:"setVolume",args:[volume]}),"*")}
function toggleAutoNext(){autoNext=!autoNext;document.getElementById("autoState").textContent=autoNext?"AN":"AUS"}
function queueAdd(s){queue.push({...s});save();renderQueue();renderStats();toast("Zur Queue hinzugefügt")}
function addCurrentToQueue(){if(current)queueAdd(current);else toast("Noch kein aktueller Song")}
function renderQueue(){document.getElementById("queueCount").textContent=queue.length;document.getElementById("queue").innerHTML=queue.length?queue.map((s,i)=>`<div class="qrow"><span><b>${esc(s.title)}</b><br><span class="meta">${esc(s.artist)}</span></span><span><button class="icon" onclick="queuePlay(${i})">▶</button><button class="icon danger" onclick="queueRemove(${i})">×</button></span></div>`).join(""):'<div class="empty">Queue ist leer.</div>';document.getElementById("statQueue").textContent=queue.length}
function queueRemove(i){queue.splice(i,1);save();renderQueue()}
function queuePlay(i){if(!queue[i])return;currentIndex=i;playSong(queue[i])}
function nextQueue(){if(!queue.length){toast("Queue ist leer");return}let i=currentIndex+1;if(i>=queue.length)i=0;queuePlay(i)}
function previousQueue(){if(!queue.length){toast("Queue ist leer");return}let i=currentIndex-1;if(i<0)i=queue.length-1;queuePlay(i)}
function renderStats(){document.getElementById("statFav").textContent=favorites.length;document.getElementById("statOwn").textContent=ownSongs.length}
async function ytSearch(){let q=document.getElementById("search").value.trim();if(!q){toast("Suchbegriff fehlt");return}ytSearchFor(q,false)}
async function ytSearchFor(q,auto){
 let box=document.getElementById("results");box.innerHTML='<div class="empty">YouTube wird durchsucht …</div>';
 try{
  let r=await fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q="+encodeURIComponent(q)+"&key="+encodeURIComponent(API_KEY)),d=await r.json();
  if(!r.ok)throw Error(d.error?.message||"YouTube API Fehler");if(!d.items?.length){box.innerHTML='<div class="empty">Keine Treffer.</div>';return}
  box.innerHTML=d.items.map(v=>{let id=v.id.videoId,s=v.snippet;return `<div class="result"><img src="${esc(s.thumbnails?.medium?.url||"")}" alt=""><div><b>${esc(s.title)}</b><div class="meta">${esc(s.channelTitle)}</div></div><div class="ra"><button class="icon" onclick='playVideo(${JSON.stringify(id)},${JSON.stringify(s.title)})'>▶</button><button class="icon" onclick='addYT(${JSON.stringify(id)},${JSON.stringify(s.title)},${JSON.stringify(s.channelTitle)})'>＋</button></div></div>`}).join("");
  if(auto)playVideo(d.items[0].id.videoId,d.items[0].snippet.title);
 }catch(e){box.innerHTML='<div class="empty">YouTube-Fehler:<br>'+esc(e.message)+'</div>'}
}
function openYouTube(q){window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank","noopener")}
function addYT(id,title,artist){let cat=filterCat||ownCats[0]||"🎵 Meine Songs";if(!ownCats.includes(cat))ownCats.push(cat);ownSongs.push({id:crypto.randomUUID(),artist,title,url:"https://www.youtube.com/watch?v="+id,videoId:id,category:cat,created:Date.now()});save();catsRender();render();toast("Song gespeichert")}
function openAdd(){
 dialog(`<h2>➕ Song hinzufügen</h2><div class="form"><div class="two"><div><label>Künstler</label><input id="fa"></div><div><label>Titel</label><input id="ft"></div></div><div><label>YouTube-Link</label><input id="fu" placeholder="https://www.youtube.com/watch?v=..."></div><div><label>Kategorie</label><select id="fc">${categories().map(c=>`<option>${esc(c.name)}</option>`).join("")}<option value="__new">+ Neue Kategorie</option></select></div><div class="toolbar" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="saveSong()">Speichern</button></div></div>`);
}
function saveSong(){
 let artist=document.getElementById("fa").value.trim(),title=document.getElementById("ft").value.trim(),url=document.getElementById("fu").value.trim(),cat=document.getElementById("fc").value;
 if(!artist||!title){toast("Künstler und Titel fehlen");return}
 if(cat==="__new"){cat=prompt("Name der neuen Kategorie","🎵 Meine Songs")?.trim();if(!cat)return;if(!ownCats.includes(cat))ownCats.push(cat)}
 let videoId=extractId(url);ownSongs.push({id:crypto.randomUUID(),artist,title,url,videoId,category:cat,created:Date.now()});save();closeModal();catsRender();render();toast("Song gespeichert")}
function deleteSong(id){if(!confirm("Diesen eigenen Song löschen?"))return;ownSongs=ownSongs.filter(s=>s.id!==id);save();catsRender();render();toast("Song gelöscht")}
function openCategoryManager(){
 dialog(`<h2>📂 Kategorien verwalten</h2><div class="notice">Start-Kategorien bleiben erhalten. Eigene Kategorien können umbenannt oder gelöscht werden.</div><div style="margin-top:12px">${ownCats.length?ownCats.map(c=>`<div class="qrow"><b>${esc(c)}</b><span><button class="icon" onclick='renameCat(${JSON.stringify(c)})'>✏️</button><button class="icon danger" onclick='deleteCat(${JSON.stringify(c)})'>🗑</button></span></div>`).join(""):'<div class="empty">Noch keine eigenen Kategorien.</div>'}</div><br><button class="btn primary" onclick="newCat()">➕ Kategorie erstellen</button>`);
}
function newCat(){let n=prompt("Neue Kategorie:")?.trim();if(!n)return;if(ownCats.includes(n)||categories().some(c=>c.name===n)){toast("Kategorie existiert bereits");return}ownCats.push(n);save();catsRender();openCategoryManager()}
function renameCat(old){let n=prompt("Neuer Name:",old)?.trim();if(!n||n===old)return;ownCats=ownCats.map(c=>c===old?n:c);ownSongs=ownSongs.map(s=>s.category===old?{...s,category:n}:s);save();catsRender();openCategoryManager();render()}
function deleteCat(c){if(!confirm("Kategorie und Zuordnung der eigenen Songs löschen?"))return;ownCats=ownCats.filter(x=>x!==c);ownSongs=ownSongs.map(s=>s.category===c?{...s,category:"🎵 Meine Songs"}:s);if(!ownCats.includes("🎵 Meine Songs"))ownCats.push("🎵 Meine Songs");save();catsRender();openCategoryManager();render()}
function openDataManager(){
 dialog(`<h2>💾 Import / Export</h2><p class="meta">Exportiert eigene Songs, Kategorien, Favoriten und Queue als JSON-Backup.</p><div class="toolbar"><button class="btn primary" onclick="exportData()">⬇️ Backup exportieren</button><button class="btn" onclick="document.getElementById('importFile').click()">⬆️ Backup importieren</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></div>`);
}
function exportData(){let data={version:1,created:new Date().toISOString(),ownSongs,ownCats,favorites,queue};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vyro-player-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exportiert")}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.ownSongs)||!Array.isArray(d.ownCats))throw Error("Ungültiges Backup");ownSongs=d.ownSongs;ownCats=d.ownCats;favorites=Array.isArray(d.favorites)?d.favorites:[];queue=Array.isArray(d.queue)?d.queue:[];save();catsRender();render();closeModal();toast("Backup importiert")}catch(x){toast("Import fehlgeschlagen: "+x.message)}};r.readAsText(f)}
function openSettings(){dialog(`<h2>⚙️ Einstellungen</h2><div class="notice">Der YouTube-Key ist clientseitig eingebaut. Für eine öffentliche Website sollte er in Google Cloud auf deine Domain eingeschränkt werden. Ein echtes Geheimnis ist ein API-Key im HTML nicht.</div><br><button class="btn danger" onclick="clearAllOwn()">Eigene Daten komplett löschen</button>`)}
function clearAllOwn(){if(!confirm("Alle eigenen Songs, Kategorien, Favoriten und Queue löschen?"))return;ownSongs=[];ownCats=[];favorites=[];queue=[];save();allSongs();closeModal();toast("Eigene Daten gelöscht")}
function adminLogin(){
 let p=prompt("Control-Room-Code:");if(p!=="VYRO-ICE-2026"){toast("Falscher Code");return}admin=true;
 dialog(`<h2>🔐 Control Room</h2><div class="notice">Admin-Modus aktiv. Hier können Bibliotheksdaten, Queue und Testfunktionen verwaltet werden.</div><br><div class="toolbar"><button class="btn primary" onclick="openDataManager()">💾 Backup</button><button class="btn" onclick="openCategoryManager()">📂 Kategorien</button><button class="btn" onclick="queue=[];save();renderQueue();toast('Queue geleert')">🧹 Queue leeren</button><button class="btn danger" onclick="admin=false;closeModal();toast('Admin-Modus beendet')">🔒 Sperren</button></div>`);
}
function dialog(content){document.getElementById("dialog").innerHTML=content;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();document.getElementById("search").focus()}});
catsRender();render();
</script>
</body>
</html>
